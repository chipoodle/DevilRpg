plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // ModDevGradle uses official Mojang mappings by default.
    // To layer community parameter names/javadocs on top, uncomment and configure the parchment block:
    // parchment {
    //     mappingsVersion = project.parchment_mappings_version
    //     minecraftVersion = project.parchment_minecraft_version
    // }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        gameTestServer {
            type = "gameTestServer"
        }

        data {
            data()
            // example of overriding the gameDirectory set in configureEach above
            gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// A2 · AISLAMIENTO DE ARNESES TEMPORALES.
// Los diagnosticos de `debug/` viven en el arbol de main por practica del proyecto, pero NO deben
// compilarse en el cliente/servidor normal: A2NavHarness detiene el servidor integrado si arranca
// en su modo por defecto. Se excluyen de `main` salvo que se pida EXPLICITAMENTE un build de
// diagnostico con `-Pa2nDiagnostics=true`. El fuente se conserva intacto y el classpath normal
// (runClient/runServer) no contiene ninguna clase de `com.chipoodle.devilrpg.debug`.
def includeA2Diagnostics = providers.gradleProperty('a2nDiagnostics').getOrElse('false') == 'true'
def includeA2ProbeOnly = providers.gradleProperty('a2nProbeOnly').getOrElse('false') == 'true'
def includeA4Lab = providers.gradleProperty('a4nLab').getOrElse('false') == 'true'
sourceSets.main {
    java {
        if (!includeA2Diagnostics) {
            exclude 'com/chipoodle/devilrpg/debug/**'
        }
        if (includeA2ProbeOnly) {
            // Probe-only diagnostic: ArenaFoundationProbe may load, but no A2 harness/probe entry point.
            exclude 'com/chipoodle/devilrpg/debug/A2NavHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/A2EntryProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/AsedioRunA2.java'
            exclude 'com/chipoodle/devilrpg/debug/A2ProdNavProbe.java'
        }
        if (includeA4Lab) {
            // A4 lab builds must not load the legacy A2 harnesses: A2NavHarness can halt the server and
            // AsedioRunA2 expects a real player/port. The lab controller is the only diagnostic entry point.
            exclude 'com/chipoodle/devilrpg/debug/A2NavHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/AsedioRunA2.java'
            exclude 'com/chipoodle/devilrpg/debug/A2ProdNavProbe.java'
        }
    }
}

repositories {
    // Put repositories for dependencies here
    // NeoForgeGradle automatically adds the NeoForge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by NeoForgeGradle.
    // If the group id is "net.neoforged" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    // implementation "net.neoforged:neoforge:${neo_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '5000'] // Show all errors during migration
}

// A2 REMEDIACIÓN 2 · pruebas enfocadas puras (sin servidor de Minecraft).
// No se añade JUnit: los tests son programas `main` que no tocan clases de Minecraft y se ejecutan
// con el classpath de test ya existente. `gradlew test` también las ejecuta.
tasks.register('policyTest') {
    group = 'verification'
    description = 'Ejecuta las pruebas puras de política de navegación, asedio y generación.'
    dependsOn tasks.named('testClasses')
    doLast {
        [
                'com.chipoodle.devilrpg.agent.ForestryTreeClaimsTest',
                'com.chipoodle.devilrpg.entity.goal.VillageGoalPriorityTest',
                'com.chipoodle.devilrpg.entity.nav.MissionDestinationTest',
                'com.chipoodle.devilrpg.entity.nav.NavRecoveryPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavArrivalPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.MovementOwnershipTest',
                'com.chipoodle.devilrpg.entity.nav.TacticalEscapeBudgetTest',
                'com.chipoodle.devilrpg.entity.nav.ObstructionRecoveryPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.BlockInteractionPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NegativeDestinationCacheTest',
                'com.chipoodle.devilrpg.entity.nav.NavTerminalDiagnosticsTest',
                'com.chipoodle.devilrpg.entity.nav.NavRouteInvalidationPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavPlannerStateTest',
                'com.chipoodle.devilrpg.world.SiegeWaveStateTest',
                'com.chipoodle.devilrpg.world.FoodHungerPolicyTest',
                'com.chipoodle.devilrpg.entity.goal.ForestryTaskPolicyTest',
                'com.chipoodle.devilrpg.world.WorldSiegePolicyTest',
                'com.chipoodle.devilrpg.world.VillageTerrainPolicyTest',
                'com.chipoodle.devilrpg.world.RaidTacticalBoardTest',
                'com.chipoodle.devilrpg.entity.goal.ForestryWorkPlannerTest',
                'com.chipoodle.devilrpg.entity.goal.ForestryTaskControllerTest',
                'com.chipoodle.devilrpg.entity.goal.VillageTaskNavigationPolicyTest',
                'com.chipoodle.devilrpg.world.VillageFarmOwnershipTest',
                'com.chipoodle.devilrpg.world.WarehouseApproachPolicyTest',
                'com.chipoodle.devilrpg.world.VillageForestLayoutTest',
                'com.chipoodle.devilrpg.world.GenerationBudgetTest'
        ].each { clase ->
            javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass = clase
                def launcher = javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = launcher.executablePath.asFile.absolutePath
            }
        }
    }
}

tasks.named('test') {
    dependsOn tasks.named('policyTest')
}
