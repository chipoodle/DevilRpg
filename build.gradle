plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    // ModDevGradle uses official Mojang mappings by default.
    // To layer community parameter names/javadocs on top, uncomment and configure the parchment block:
    // parchment {
    //     mappingsVersion = project.parchment_mappings_version
    //     minecraftVersion = project.parchment_minecraft_version
    // }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
            // A2 headless integration runs opt into a private game directory and JVM diagnostics.
            if (providers.gradleProperty('a2nGameDirectory').isPresent()) {
                gameDirectory = project.file(providers.gradleProperty('a2nGameDirectory').get())
            }
            // Skills server harness · dedicated server with a fake player, isolated game dir.
            if (providers.gradleProperty('skillGameDirectory').isPresent()) {
                gameDirectory = project.file(providers.gradleProperty('skillGameDirectory').get())
            }
            if (providers.gradleProperty('a2nMode').isPresent()) {
                systemProperty 'a2n.mode', providers.gradleProperty('a2nMode').get()
            }
            if (providers.gradleProperty('a2nMaintenanceHook').isPresent()) {
                systemProperty 'devilrpg.a2n.allowMaintenanceHook',
                        providers.gradleProperty('a2nMaintenanceHook').get()
            }
            if (providers.gradleProperty('a2nPhaseA').isPresent()) {
                systemProperty 'a2n.faseA', providers.gradleProperty('a2nPhaseA').get()
            }
            if (providers.gradleProperty('a2nPhaseB').isPresent()) {
                systemProperty 'a2n.faseB', providers.gradleProperty('a2nPhaseB').get()
            }
            if (providers.gradleProperty('a2nRecoveryTicks').isPresent()) {
                systemProperty 'a2n.recuperacionTicks', providers.gradleProperty('a2nRecoveryTicks').get()
            }
            if (providers.gradleProperty('a2nRunId').isPresent()) {
                systemProperty 'a2n.raiz', project.projectDir.absolutePath
                systemProperty 'a2n.run', providers.gradleProperty('a2nRunId').get()
            }
            if (providers.gradleProperty('a2nTraceNav').isPresent()) {
                systemProperty 'devilrpg.a2n.traceNav', providers.gradleProperty('a2nTraceNav').get()
            }
            if (providers.gradleProperty('a2nTraceGlobalSearch').isPresent()) {
                systemProperty 'devilrpg.a2n.traceGlobalSearch',
                        providers.gradleProperty('a2nTraceGlobalSearch').get()
            }
            if (providers.gradleProperty('a2nGuardDiag').isPresent()) {
                systemProperty 'devilrpg.guarddiag', providers.gradleProperty('a2nGuardDiag').get()
            }
            if (providers.gradleProperty('a2nTraceCombat').isPresent()) {
                systemProperty 'devilrpg.a2n.traceCombat', providers.gradleProperty('a2nTraceCombat').get()
            }
            // Incremento 3 · D: la instrumentacion del planner esta APAGADA por defecto. Para medir en un
            // runServer concreto: -PnavMetrics=true (y volcar NavPlannerMetrics.dump() al cerrar el arnes).
            if (providers.gradleProperty('navMetrics').isPresent()) {
                systemProperty 'devilrpg.nav.metrics', providers.gradleProperty('navMetrics').get()
            }
            // AV · campana runtime de navegacion (NavScenarioHarness). El arnes lee estas propiedades.
            if (providers.gradleProperty('navHarnessRun').isPresent()) {
                systemProperty 'devilrpg.nav.harness.run', providers.gradleProperty('navHarnessRun').get()
                // El proceso del juego corre con CWD en game/, asi que la raiz del repo se pasa explicita.
                systemProperty 'a2n.raiz', project.projectDir.absolutePath
            }
            if (providers.gradleProperty('navHarnessRep').isPresent()) {
                systemProperty 'devilrpg.nav.harness.rep', providers.gradleProperty('navHarnessRep').get()
            }
            if (providers.gradleProperty('navHarnessScenarios').isPresent()) {
                systemProperty 'devilrpg.nav.harness.scenarios',
                        providers.gradleProperty('navHarnessScenarios').get()
            }
            if (providers.gradleProperty('navHarnessEscala').isPresent()) {
                systemProperty 'devilrpg.nav.harness.escala',
                        providers.gradleProperty('navHarnessEscala').get()
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        gameTestServer {
            type = "gameTestServer"
        }

        data {
            data()
            // example of overriding the gameDirectory set in configureEach above
            gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Test policy classes may use Minecraft value types (BlockPos); give the test source set the same
// compile/runtime classpath as main. Pure policy tests remain unaffected.
sourceSets.test {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}

// A2 · AISLAMIENTO DE ARNESES TEMPORALES.
// Los diagnosticos de `debug/` viven en el arbol de main por practica del proyecto, pero NO deben
// compilarse en el cliente/servidor normal: A2NavHarness detiene el servidor integrado si arranca
// en su modo por defecto. Se excluyen de `main` salvo que se pida EXPLICITAMENTE un build de
// diagnostico con `-Pa2nDiagnostics=true`. El fuente se conserva intacto y el classpath normal
// (runClient/runServer) no contiene ninguna clase de `com.chipoodle.devilrpg.debug`.
def includeA2Diagnostics = providers.gradleProperty('a2nDiagnostics').getOrElse('false') == 'true'
def useA2PopulationQueryHarness = providers.gradleProperty('a2nPopulationQueryHarness').getOrElse('false') == 'true'
def includeA2ProbeOnly = providers.gradleProperty('a2nProbeOnly').getOrElse('false') == 'true'
// POI · ARNÉS DE PERSISTENCIA REAL (ServerLevel/PoiManager). Opt-in y aislado:
//   - sin el flag, el build es EXACTAMENTE el de siempre (ninguna clase nueva compila en main);
//   - con `-PpoiHarness=true` se excluye TODO `debug/**` y se compila `tools/poi`, donde viven
//     PoiPersistenceHarness y PoiPersistenceReport. Así C4, OwnershipProbe, A2NavHarness o cualquier
//     otro arnés de `debug/` NO se carga al arrancar el servidor del arnés POI (evita que compitan por
//     ServerStartedEvent/tick, que fue el motivo de aislarlo).
def includePoiHarness = providers.gradleProperty('poiHarness').getOrElse('false') == 'true'
if (includePoiHarness && !includeA2Diagnostics) {
    throw new GradleException('poiHarness requires -Pa2nDiagnostics=true')
}

if (useA2PopulationQueryHarness && !includeA2Diagnostics) {
    throw new GradleException('a2nPopulationQueryHarness requires -Pa2nDiagnostics=true')
}
def includeA4Lab = providers.gradleProperty('a4nLab').getOrElse('false') == 'true'
// AV · Arnés de escenarios runtime de navegación. Opt-in: -PnavHarness=true. En ese build SOLO
// NavScenarioHarness.java es un entry point de `debug/`; el resto se excluye para que ningún otro
// suscriptor compita por ServerStartedEvent/ServerTickEvent ni detenga el servidor.
def includeNavHarness = providers.gradleProperty('navHarness').getOrElse('false') == 'true'
// AV · Soak multi-día. Opt-in y aislado: -PsoakHarness=true excluye TODO debug/ y compila tools/soak,
// que es el único entry point del run. Así C4/A2/POI no compiten por ServerStartedEvent ni por el tick.
def includeSoakHarness = providers.gradleProperty('soakHarness').getOrElse('false') == 'true'
// Skills · servidor dedicado con fake player (capability, árbol, ejecución). Opt-in y aislado:
// -PskillHarness=true compila SOLO tools/skills y excluye todo debug/ (C4/A2/POI no compiten).
def includeSkillHarness = providers.gradleProperty('skillHarness').getOrElse('false') == 'true'
sourceSets.main {
    java {
        if (includeSoakHarness) {
            exclude 'com/chipoodle/devilrpg/debug/**'
            srcDir file('tools/soak')
        } else if (includeSkillHarness) {
            exclude 'com/chipoodle/devilrpg/debug/**'
            srcDir file('tools/skills')
        } else if (!includeA2Diagnostics && !includeNavHarness) {
            exclude 'com/chipoodle/devilrpg/debug/**'
        } else if (includeNavHarness) {
            // Único entry point del run de navegación.
            exclude 'com/chipoodle/devilrpg/debug/A2EntryProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/A2FoundationBootstrap.java'
            exclude 'com/chipoodle/devilrpg/debug/A2NavHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/A2ProdNavProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/A2TerrainDump.java'
            exclude 'com/chipoodle/devilrpg/debug/A4NavigationLab.java'
            exclude 'com/chipoodle/devilrpg/debug/A5TestController.java'
            exclude 'com/chipoodle/devilrpg/debug/ArenaFoundationProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/AsedioRunA2.java'
            exclude 'com/chipoodle/devilrpg/debug/C4StandaloneHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/ForestryTaskBoundaryProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/N4GoalLab.java'
            exclude 'com/chipoodle/devilrpg/debug/R3TerrainLab.java'
        } else {
            // The C4 server run loads only the selected A2NavHarness; other debug subscribers
            // must not compete for startup, ticks, worlds, or shutdown.
            exclude 'com/chipoodle/devilrpg/debug/A2EntryProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/A2FoundationBootstrap.java'
            exclude 'com/chipoodle/devilrpg/debug/A2ProdNavProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/A4NavigationLab.java'
            exclude 'com/chipoodle/devilrpg/debug/A5TestController.java'
            exclude 'com/chipoodle/devilrpg/debug/ArenaFoundationProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/AsedioRunA2.java'
            exclude 'com/chipoodle/devilrpg/debug/ForestryTaskBoundaryProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/N4GoalLab.java'
            exclude 'com/chipoodle/devilrpg/debug/R3TerrainLab.java'
            // AV: el arnés de navegación solo compila con -PnavHarness=true.
            exclude 'com/chipoodle/devilrpg/debug/NavScenarioHarness.java'
        }
        if (useA2PopulationQueryHarness) {
            // Phase55 population-query diagnostic: compile the maintained canonical source from
            // tools/a2n, while preserving (and excluding only from this opt-in build) the older
            // tracked debug harness. Other diagnostic builds continue using the legacy source.
            exclude 'com/chipoodle/devilrpg/debug/A2NavHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/NavScenarioHarness.java'
            sourceSets.main.java.srcDir file('tools/a2n')
        }
        if (includeA2ProbeOnly) {
            // Probe-only diagnostic: ArenaFoundationProbe may load, but no A2 harness/probe entry point.
            exclude 'com/chipoodle/devilrpg/debug/A2NavHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/A2EntryProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/AsedioRunA2.java'
            exclude 'com/chipoodle/devilrpg/debug/A2ProdNavProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/NavScenarioHarness.java'
        }
        if (includeA4Lab) {
            // A4 lab builds must not load the legacy A2 harnesses: A2NavHarness can halt the server and
            // AsedioRunA2 expects a real player/port. The lab controller is the only diagnostic entry point.
            exclude 'com/chipoodle/devilrpg/debug/A2NavHarness.java'
            exclude 'com/chipoodle/devilrpg/debug/AsedioRunA2.java'
            exclude 'com/chipoodle/devilrpg/debug/A2ProdNavProbe.java'
            exclude 'com/chipoodle/devilrpg/debug/NavScenarioHarness.java'
        }
        if (includePoiHarness) {
            // El arnés POI es el ÚNICO entry point de este build: fuera todo debug/ (C4, OwnershipProbe,
            // A2NavHarness...) y dentro tools/poi, que es donde vive su fuente versionada.
            exclude 'com/chipoodle/devilrpg/debug/**'
            srcDir file('tools/poi')
        }
    }
}

repositories {
    // Put repositories for dependencies here
    // NeoForgeGradle automatically adds the NeoForge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by NeoForgeGradle.
    // If the group id is "net.neoforged" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    // implementation "net.neoforged:neoforge:${neo_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '5000'] // Show all errors during migration
}

// A2 REMEDIACIÓN 2 · pruebas enfocadas puras (sin servidor de Minecraft).
// No se añade JUnit: los tests son programas `main` que no tocan clases de Minecraft y se ejecutan
// con el classpath de test ya existente. `gradlew test` también las ejecuta.
sourceSets {
    foodTest {
        java.srcDir 'src/foodTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Incremento 3 · B: pruebas de integracion NBT/save-reload con las clases reales de Minecraft
    // (Bootstrap headless, CompoundTag y VillageSavedData.save/load). No necesitan servidor.
    villageTest {
        java.srcDir 'src/villageTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // POI · autotest PURO de la logica del arnes POI (comparacion, clasificacion y JSON). No importa
    // Minecraft: compila y corre sin servidor, asi que es un gate barato que no depende del arnes real.
    poiTest {
        java.srcDir 'tools/poi'
        java.include '**/PoiPersistenceReport.java'
    }
    // Skills · primer gate headless del subsistema (24-nov-2026): arbol JSON, catalogo, ejecutores y NBT
    // de la capability. No necesita cliente ni servidor; usa Bootstrap como villageTest.
    skillTest {
        java.srcDir 'src/skillTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('foodTestSuite') {
    group = 'verification'
    description = 'Ejecuta toda la suite Food Economy: política, NBT real e integración SavedData.'
    dependsOn tasks.named('policyTest')
    dependsOn tasks.named('foodNbtTest')
    dependsOn tasks.named('foodIntegrationTest')
}
tasks.register('foodIntegrationTest', JavaExec) {
    group = 'verification'
    description = 'Prueba real de despensa y persistencia VillageSavedData (sin lanzar Minecraft).'
    dependsOn tasks.named('foodTestClasses')
    classpath = sourceSets.foodTest.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.world.FoodIntegrationTest'
}
tasks.register('foodNbtTest', JavaExec) {
    group = 'verification'
    description = 'Prueba NBT real del codec de comida (sin lanzar Minecraft).'
    dependsOn tasks.named('foodTestClasses')
    classpath = sourceSets.foodTest.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.world.FoodStateNbtTest'
}
// Incremento 3 · B: serializacion/restauracion REAL de VillageSavedData con CompoundTag de Minecraft.
tasks.register('villagePersistenceTest', JavaExec) {
    group = 'verification'
    description = 'Prueba de integracion NBT/save-reload de la aldea (Bootstrap headless, sin servidor).'
    dependsOn tasks.named('villageTestClasses')
    classpath = sourceSets.villageTest.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.world.VillagePersistenceIntegrationTest'
}

// Skills · arbol JSON <-> SkillEnum <-> ejecutores <-> NBT de la capability, sin cliente ni servidor.
tasks.register('skillCapabilityTest', JavaExec) {
    group = 'verification'
    description = 'Valida el arbol de skills y la persistencia de la capability (Bootstrap headless).'
    dependsOn tasks.named('skillTestClasses')
    classpath = sourceSets.skillTest.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.capability.skill.SkillCapabilityIntegrationTest'
}

// POI · autotest PURO de la logica del arnes de POI/tickets. No lanza Minecraft ni el servidor.
tasks.register('poiPersistenceSelftest', JavaExec) {
    group = 'verification'
    description = 'Autotest sin Minecraft de la logica POI: duplicados, huerfanos, tickets, JSON.'
    dependsOn tasks.named('poiTestClasses')
    classpath = sourceSets.poiTest.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.debug.PoiPersistenceReport'
}

// Incremento 3 · D: linea base reproducible del A* real con grafos sinteticos deterministas.
tasks.register('navBaselineTest', JavaExec) {
    group = 'verification'
    description = 'Ejecuta la linea base del planner (expansiones, tiempo, nodos/tick, agregado).'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.entity.nav.NavSearchBaselineTest'
}

// AV · Contrato headless del catalogo de escenarios runtime (sin servidor ni mundo).
// Verifica que tools/nav/NavScenarioHarness.java declara los 21 escenarios exigidos, sin duplicados,
// con transiciones/acciones/presupuestos coherentes, y que el lanzador y el flag Gradle existen.
tasks.register('navScenarioContractTest', JavaExec) {
    group = 'verification'
    description = 'Valida el contrato del catalogo de escenarios de navegacion (headless).'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.chipoodle.devilrpg.entity.nav.NavScenarioContractTest'
}

tasks.register('policyTest') {
    group = 'verification'
    description = 'Ejecuta las pruebas puras de política de navegación, asedio y generación.'
    dependsOn tasks.named('testClasses')
    doLast {
        [
                'com.chipoodle.devilrpg.agent.ForestryTreeClaimsTest',
                'com.chipoodle.devilrpg.agent.ForestryResourceTraceTest',
                'com.chipoodle.devilrpg.entity.goal.VillageGoalPriorityTest',
                'com.chipoodle.devilrpg.entity.nav.MissionDestinationTest',
                'com.chipoodle.devilrpg.entity.nav.AdvanceUnderFirePolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavRecoveryPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavArrivalPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavRouteNodePolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavDropTakeoffPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavSourceCellPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavSnapOwnershipPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavSnapPostResetPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavAdjacentApproachPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavDropApproachPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavDropApproachOwnershipPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavDropEdgeStepPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavStairAnchorPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.StairBuildResultTest',
                'com.chipoodle.devilrpg.entity.nav.NavObjectivePolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavLocalObjectiveStepPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavCombatIntentPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavBreakContractTest',
                'com.chipoodle.devilrpg.entity.nav.NavBreakGraphStateTest',
                'com.chipoodle.devilrpg.entity.nav.NavBreakRoutePolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavBreakAttackPositionPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavNeighborPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavFeetCellPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavLocalObjectiveLegPolicyTest',
                'com.chipoodle.devilrpg.entity.nav.NavDropOvershootPolicyTest',
